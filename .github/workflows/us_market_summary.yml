name: US Market Summary

on:
  schedule:
    # 21:15 UTC, Mon-Fri = 06:15 KST Tue-Sat (미국 여름시간 기준 마감 20:00 UTC + 75분 버퍼,
    # 마감 속보 기사가 올라올 시간을 준 것 — 11월 서머타임 해제되면 buffer가 1시간 줄어듦)
    - cron: '15 21 * * 1-5'
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic requests
      - run: python us_market_summary/report.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.US_MARKET_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.US_MARKET_TELEGRAM_CHAT_IDS }}
